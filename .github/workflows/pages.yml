# Выкладка витрины на GitHub Pages.
#
# configure-pages с enablement: true включает Pages сам, поэтому руками в
# настройки репозитория лезть не нужно - иначе «выложено» зависело бы от
# того, не забыл ли человек нажать переключатель.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна выкладка за раз; начатую не обрываем, чтобы не оставить страницу
# наполовину заменённой.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  vylozhit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.vykladka.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Проверка фактом, а не верой: страница должна быть на месте и не
      # быть заглушкой. Пустой index.html выложился бы молча.
      - name: страница на месте
        run: |
          test -s index.html
          grep -q "VITRINA_PRAVILA" index.html
          echo "index.html: $(wc -c < index.html) байт, таблица прав на месте"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: vykladka
        uses: actions/deploy-pages@v4
